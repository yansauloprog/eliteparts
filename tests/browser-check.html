<!doctype html><meta charset="utf-8"><title>Elite Parts — verificação responsiva</title><style>body{margin:0;background:#eee;font:16px Arial}section{margin:20px;width:max-content}iframe{border:0;display:block;height:900px}h2{margin:10px 0}</style><main><section><h2>Login · 320px</h2><iframe title="Login 320" width="320" src="/admin/login"></iframe></section><section><h2>Login · 390px</h2><iframe title="Login 390" width="390" src="/admin/login"></iframe></section><section><h2>Login · 768px</h2><iframe title="Login 768" width="768" src="/admin/login"></iframe></section><section><h2>Login · 1024px</h2><iframe title="Login 1024" width="1024" src="/admin/login"></iframe></section><section><h2>Login · 1440px</h2><iframe title="Login 1440" width="1440" src="/admin/login"></iframe></section></main>
<script type="module">
import {processImage} from '/src/services/productImages.ts';
const results=[];
async function run(name,fn){try{await fn();results.push({name,status:'passed'});}catch(e){results.push({name,status:'failed',error:String(e)});}}
const canvas=document.createElement('canvas');canvas.width=2400;canvas.height=1200;const ctx=canvas.getContext('2d');ctx.fillStyle='red';ctx.fillRect(0,0,1200,1200);
const blob=(type)=>new Promise(r=>canvas.toBlob(r,type));
for(const type of ['image/jpeg','image/png'])await run(type+' to gallery and thumbnail WebP',async()=>{const f=new File([await blob(type)],'test.'+(type==='image/png'?'png':'jpg'),{type});const output=await processImage(f);if(output.full.type!=='image/webp'||output.thumb.type!=='image/webp')throw Error('Invalid format');const full=await createImageBitmap(output.full),thumb=await createImageBitmap(output.thumb);if(full.width!==1600||full.height!==800||thumb.width!==480||thumb.height!==240)throw Error('Incorrect dimensions/aspect ratio');if(type==='image/png'){const target=document.createElement('canvas');target.width=1600;target.height=800;const c=target.getContext('2d');c.drawImage(full,0,0);if(c.getImageData(1500,400,1,1).data[3]!==0)throw Error('Transparency lost');}full.close();thumb.close();});
await run('Invalid MIME rejected',async()=>{try{await processImage(new File(['x'],'test.svg',{type:'image/svg+xml'}));throw Error('Not rejected');}catch(e){if(!String(e).includes('Escolha uma imagem'))throw e;}});
await run('Oversized file rejected',async()=>{try{await processImage(new File([new Uint8Array(10*1024*1024+1)],'test.png',{type:'image/png'}));throw Error('Not rejected');}catch(e){if(!String(e).includes('10 MB'))throw e;}});
const pre=document.createElement('pre');pre.id='image-test-results';pre.textContent=JSON.stringify(results,null,2);document.body.prepend(pre);
</script>
